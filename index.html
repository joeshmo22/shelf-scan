<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Scan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#1b2a22;--muted:#5d6b63;--line:#d9dfd6;--accent:#1f6f4a;--accent-ink:#fff;--warn:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121915;--surface:#1b2520;--ink:#e8efe9;--muted:#9bab9f;--line:#2c3a32;--accent:#57c08a;--accent-ink:#0c1a12;--warn:#ef8a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121915;--surface:#1b2520;--ink:#e8efe9;--muted:#9bab9f;--line:#2c3a32;--accent:#57c08a;--accent-ink:#0c1a12;--warn:#ef8a74;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 1.6rem/1.1 Georgia,"Times New Roman",serif;margin:4px 0 14px}
h2{font:600 1.05rem Georgia,serif;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:400 .85rem system-ui,sans-serif;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
#cam{display:none;position:relative;margin-bottom:10px}
#cam video{width:100%;border-radius:12px;background:#000;max-height:46vh;object-fit:cover}
#cam .guide{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.msg{min-height:1.4em;color:var(--muted);font-size:.9rem;margin:8px 0 0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;overflow-wrap:anywhere}
.item .c{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;padding:0}
.qty b{min-width:26px;text-align:center}
.del{color:var(--warn)}
.empty{color:var(--muted);padding:8px 0}
.tools{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#dlg{display:none;margin-top:10px}
#dlg label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
</style>
</head>
<body>
<main>
<h1>Shelf Scan</h1>

<div id="cam"><video id="vid" playsinline muted></video><div class="guide"></div></div>

<div class="row">
  <button class="primary" id="scanBtn">Start scanner</button>
  <button id="stopBtn" style="display:none">Stop scanner</button>
</div>

<div class="panel" style="margin-top:10px">
  <label for="manual" style="font-size:.85rem;color:var(--muted)">Or type or paste a barcode</label>
  <div class="row" style="margin-top:4px"><input id="manual" inputmode="numeric" placeholder="e.g. 012345678905"><button id="addManual" style="flex:0 0 auto">Add</button></div>
  <p class="msg" id="msg" role="status"></p>
</div>

<div class="panel" id="dlg">
  <b>New item</b> <span id="dlgCode" style="color:var(--muted);font-size:.85rem"></span>
  <label for="dName">Name</label><input id="dName" placeholder="e.g. Black beans">
  <label for="dCat">Category</label>
  <div class="row"><select id="dCat"></select><button id="newCat" style="flex:0 0 auto">New category</button></div>
  <div class="row" style="margin-top:12px"><button class="primary" id="dSave">Save item</button><button id="dCancel">Cancel</button></div>
</div>

<div style="margin-top:18px">
  <label for="search" style="font-size:.85rem;color:var(--muted)">Search your inventory</label>
  <input id="search" type="search" placeholder="Name, barcode or category" autocomplete="off" style="margin-top:4px">
</div>

<div id="list"></div>

<div class="tools">
  <button id="copyCsv">Copy as CSV</button>
  <button id="clearAll" class="del">Clear all</button>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
var KEY='shelfscan:v1';
var state={cats:['Pantry','Fridge','Freezer','Household','Other'],items:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.items&&p.cats)state=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var $=function(id){return document.getElementById(id)};
var msg=function(t){$('msg').textContent=t};
var tipTimer=null,pending=null,stream=null,detector=null,zx=null,scanning=false,lastCode='',lastAt=0;

function render(){
  var q=($('search')?$('search').value:'').trim().toLowerCase();
  var out='',shown=0;
  state.cats.forEach(function(cat){
    var all=Object.keys(state.items).filter(function(c){return state.items[c].cat===cat});
    var total=all.reduce(function(s,c){return s+state.items[c].qty},0);
    var codes=!q?all:all.filter(function(c){
      return (state.items[c].name+' '+c+' '+cat).toLowerCase().indexOf(q)>-1;
    });
    if(q&&!codes.length)return;
    shown+=codes.length;
    out+='<h2>'+esc(cat)+'<span>'+(q?codes.length+' of '+all.length+' items':total+' in stock')+'</span></h2><div class="panel">';
    if(!codes.length)out+='<div class="empty">Nothing here yet. Scan an item to add it.</div>';
    codes.forEach(function(c){var it=state.items[c];
      out+='<div class="item"><div class="t"><div class="n">'+esc(it.name)+'</div><div class="c">'+esc(c)+'</div></div>'+
      '<div class="qty"><button data-a="dec" data-c="'+esc(c)+'" aria-label="Remove one">−</button><b>'+it.qty+'</b><button data-a="inc" data-c="'+esc(c)+'" aria-label="Add one">+</button></div>'+
      '<button class="del" data-a="del" data-c="'+esc(c)+'" aria-label="Delete item">✕</button></div>';});
    out+='</div>';
  });
  if(q&&!shown)out='<div class="panel empty" style="margin-top:16px">No items match “'+esc(q)+'”.</div>';
  $('list').innerHTML=out;
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var c=b.dataset.c,it=state.items[c];if(!it)return;
  if(b.dataset.a==='inc')it.qty++;
  else if(b.dataset.a==='dec')it.qty=Math.max(0,it.qty-1);
  else if(b.dataset.a==='del'&&confirm('Delete '+it.name+'?'))delete state.items[c];
  save();render();
});

function handleCode(code){
  code=String(code).trim();if(!code)return;
  var now=Date.now();if(code===lastCode&&now-lastAt<2500)return;lastCode=code;lastAt=now;
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  if(state.items[code]){state.items[code].qty++;save();render();msg('Added one more '+state.items[code].name+' ('+state.items[code].qty+' total).');return;}
  pending=code;$('dlgCode').textContent=code;$('dName').value='';fillCats();$('dlg').style.display='block';$('dName').focus();
  msg('New barcode. Looking up the product…');
  lookup(code);
}
function guessCat(tags,brand){
  var t=(tags||[]).join(' ').toLowerCase();
  if(/frozen/.test(t))return'Freezer';
  if(/dairies|milk|cheese|yogurt|yoghurt|meats|fresh|eggs|fish|deli/.test(t))return'Fridge';
  if(t)return'Pantry';
  return null;
}
async function lookup(code){
  var hosts=['world.openfoodfacts.org','world.openproductsfacts.org','world.openbeautyfacts.org','world.openpetfoodfacts.org'];
  for(var i=0;i<hosts.length;i++){
    if(pending!==code)return;
    try{
      var ctl=new AbortController();var to=setTimeout(function(){ctl.abort()},6000);
      var r=await fetch('https://'+hosts[i]+'/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,quantity,categories_tags',{signal:ctl.signal});
      clearTimeout(to);
      var j=await r.json();
      if(j&&j.status===1&&j.product&&j.product.product_name){
        if(pending!==code)return;
        var pr=j.product,nm=pr.product_name+(pr.brands?' ('+pr.brands.split(',')[0].trim()+')':'');
        if(!$('dName').value.trim())$('dName').value=nm;
        var g=guessCat(pr.categories_tags);
        if(!g&&i>0)g='Household';
        if(g&&state.cats.indexOf(g)>=0)$('dCat').value=g;
        msg('Found: '+nm+'. Check the category, then save.');return;
      }
    }catch(e){}
  }
  if(pending===code)msg('No match found online. Type a name and pick a category.');
}
function fillCats(sel){$('dCat').innerHTML=state.cats.map(function(c){return'<option>'+esc(c)+'</option>'}).join('');if(sel)$('dCat').value=sel;}
$('dSave').onclick=function(){
  var n=$('dName').value.trim();if(!n){msg('Enter a name for this item.');return;}
  state.items[pending]={name:n,cat:$('dCat').value,qty:1};save();render();
  $('dlg').style.display='none';msg('Saved '+n+' in '+$('dCat').value+'.');pending=null;
};
$('dCancel').onclick=function(){$('dlg').style.display='none';pending=null;msg('');};
$('newCat').onclick=function(){
  var n=(prompt('Category name')||'').trim();if(!n)return;
  if(state.cats.indexOf(n)<0)state.cats.push(n);save();fillCats(n);render();
};
$('addManual').onclick=function(){handleCode($('manual').value);$('manual').value='';};
$('manual').addEventListener('keydown',function(e){if(e.key==='Enter')$('addManual').click();});

async function startScan(){
  if(scanning)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Camera is not available here. Use the barcode field instead.');return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    try{var tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.indexOf('continuous')>-1)await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}
  }catch(e){msg('Camera access was blocked. Allow camera permission, or type the barcode instead.');return;}
  var v=$('vid');v.srcObject=stream;await v.play().catch(function(){});
  $('cam').style.display='block';$('scanBtn').style.display='none';$('stopBtn').style.display='block';scanning=true;msg('Point the camera at a barcode.');
  if('BarcodeDetector' in window){
    try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});}catch(e){detector=new BarcodeDetector();}
    msg('Scanner ready (built-in). Hold the barcode 6 to 10 inches away.');
    loopNative();
  }else if(window.ZXing){
    var h=new Map();
    var F=ZXing.BarcodeFormat;
    h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.QR_CODE]);
    h.set(ZXing.DecodeHintType.TRY_HARDER,true);
    zx=new ZXing.BrowserMultiFormatReader(h,250);
    msg('Scanner ready (backup mode, can be slower). Hold the barcode 6 to 10 inches away.');
    zx.decodeFromVideoElement(v,function(res){if(res&&scanning)handleCode(res.getText());});
  }else{msg('Live scanning is not supported in this browser. Use the barcode field.');}
  clearTimeout(tipTimer);
  tipTimer=setTimeout(function(){if(scanning&&!lastCode)msg('Nothing detected yet. Fill the frame with the barcode, keep it flat and steady, and avoid glare. You can also type the number below.');},8000);
}
async function loopNative(){
  var v=$('vid');
  while(scanning){
    try{var r=await detector.detect(v);if(r.length)handleCode(r[0].rawValue);}catch(e){}
    await new Promise(function(r){setTimeout(r,180)});
  }
}
function stopScan(){
  scanning=false;clearTimeout(tipTimer);
  try{if(zx)zx.reset();}catch(e){}
  if(stream)stream.getTracks().forEach(function(t){t.stop()});stream=null;
  $('cam').style.display='none';$('scanBtn').style.display='block';$('stopBtn').style.display='none';
}
$('scanBtn').onclick=startScan;$('stopBtn').onclick=stopScan;

$('copyCsv').onclick=function(){
  var q=function(s){return'"'+String(s).replace(/"/g,'""')+'"'};
  var rows=['barcode,name,category,quantity'];
  Object.keys(state.items).forEach(function(c){var i=state.items[c];rows.push([q(c),q(i.name),q(i.cat),i.qty].join(','))});
  var txt=rows.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){msg('CSV copied to your clipboard.')},function(){
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');msg('CSV copied to your clipboard.');}catch(e){msg('Copy failed.');}
    document.body.removeChild(ta);});
};
$('clearAll').onclick=function(){if(confirm('Delete every item? This cannot be undone.')){state.items={};save();render();msg('Inventory cleared.');}};
$('search').addEventListener('input',render);
render();
})();
</script>
</body>
</html>
